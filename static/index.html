<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🐾 Менеджер котиков и кормов</h1>

    <div class="tabs">
        <button class="tab-button active" onclick="openTab('cats-tab')">Котики</button>
        <button class="tab-button" onclick="openTab('food-tab')">Корм</button>
    </div>

    <!-- Вкладка с котиками -->
    <div id="cats-tab" class="tab-content active">
        <h2>Список котиков</h2>
        <button onclick="loadCats()">Обновить список</button>
        <div id="cats-list"></div>

        <h2>Добавить нового котика</h2>
      <form id="add-cat-form">
    <input type="text" name="name" placeholder="Имя" required>
    <input type="text" name="breed" placeholder="Порода" required>
    <input type="number" name="age" placeholder="Возраст" min="0" required>
    <input type="text" name="favorite_food" placeholder="Любимый корм">
    <button type="button" onclick="handleCatForm()">Добавить котика</button>
</form>
    </div>

    <!-- Вкладка с кормом -->
    <div id="food-tab" class="tab-content">
        <h2>Список кормов</h2>
        <button onclick="loadFood()">Обновить список</button>
        <div id="food-list"></div>

        <h2>Фильтровать корм</h2>
        <div>
            <h3>По бренду:</h3>
            <input type="text" id="brand-filter" placeholder="Введите бренд">
            <button onclick="loadFoodByBrand()">Найти</button>
        </div>
        <div>
            <h3>По цене:</h3>
            <input type="number" id="min-price" placeholder="Мин. цена" min="0">
            <input type="number" id="max-price" placeholder="Макс. цена" min="0">
            <button onclick="loadFoodByPrice()">Найти</button>
        </div>
        <div>
            <h3>По рейтингу (от):</h3>
            <input type="number" id="min-rating" placeholder="Рейтинг от" min="0" max="5" step="0.1">
            <button onclick="loadFoodByRating()">Найти</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
